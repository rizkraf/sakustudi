services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sakustudi
      POSTGRES_USER: sakustudi
      POSTGRES_PASSWORD: sakustudi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakustudi -d sakustudi"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
  # S3-compatible object storage for STORAGE_DRIVER=s3 local development
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sakustudi
      MINIO_ROOT_PASSWORD: sakustudi-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio-data:
