services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sakustudi
      POSTGRES_USER: sakustudi
      POSTGRES_PASSWORD: sakustudi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakustudi -d sakustudi"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
